[package]
license = "Apache-2.0"
name = "gx-remote-api"
version = "0.1.0"
edition.workspace = true
publish = false
description = "gx-only loopback HTTP facade over the grok leader, attached as an observer ACP client."

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
# `O_NOFOLLOW`/`O_NONBLOCK` on the token open, and `geteuid` for its ownership check (`src/auth.rs`).
libc = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# `wrappers::ReceiverStream` turns the SSE lane's per-connection queue into the `Stream`
# `axum::response::sse::Sse` wants, and `StreamExt` reads a response body back in the tests.
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
xai-dirs = { workspace = true }
# gx: upstream 1.0.45 dropped `xai-grok-shell` from `[workspace.dependencies]`
# when it split the shell crate. Keep the path dep here; do not put the shell
# crate back into the workspace table.
xai-grok-shell = { path = "../../codegen/xai-grok-shell" }
xai-grok-version = { workspace = true }
# Vocabulary for the C5 authorization matrix (`Operation` / `OperationSet`).
xai-message-delivery-core = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
