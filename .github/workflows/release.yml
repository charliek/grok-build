name: Release

# Triggered by pushing a tag matching gx-v*.
#
# Tag convention: gx-v<upstream-version>-gx.<release>, e.g. gx-v1.0.8-gx.1.
# scripts/gx/version.sh produces <upstream-version>+gx.<release> (e.g.
# 1.0.8+gx.1) -- a literal `+` is legal in a git tag but awkward to work
# with (shell/URL/filename escaping), so the tag spells the same thing with
# `-gx.` instead of `+gx.`. The "verify version" step below re-derives the
# `+`-form from the tag and asserts it is byte-identical to what
# scripts/gx/version.sh reports, and that it shows up in `gx --version`.

on:
  push:
    tags:
      - "gx-v*"

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            archive_os: macos-arm64
          # NOTE: ubuntu-22.04 ships glibc 2.35. The resulting binary is
          # linked against that baseline and will not run on distros with
          # an older glibc (e.g. Ubuntu 20.04/glibc 2.31, Debian 11). This
          # is a deliberate, documented tradeoff, not an oversight -- if a
          # lower baseline is ever required, this job needs cross/musl or
          # an older runner image. (Not encoded in the artifact name: the
          # archive is named by target triple, not by glibc version.)
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_os: linux-x86_64
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf
          protoc --version

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Rust cache
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          key: ${{ matrix.target }}

      # scripts/gx/build.sh drives `cargo build -p xai-grok-pager-bin
      # --release` with GROK_VERSION stamped from scripts/gx/version.sh, and
      # copies the artifact to `gx` next to it. It doesn't take a --locked
      # flag itself, but the workspace's committed Cargo.lock is used as-is
      # (cargo only rewrites it if the lockfile can't satisfy the manifest,
      # which would itself be a build failure worth seeing).
      - name: Build gx
        id: build
        run: |
          gx_bin_path="$(scripts/gx/build.sh)"
          echo "gx_bin_path=${gx_bin_path}" >> "$GITHUB_OUTPUT"

      - name: Derive and verify version
        id: version
        run: |
          set -euo pipefail

          expected_version="$(scripts/gx/version.sh)"
          echo "scripts/gx/version.sh reports: ${expected_version}"

          tag_name="${GITHUB_REF_NAME}"
          if [[ ! "${tag_name}" =~ ^gx-v([0-9]+\.[0-9]+\.[0-9]+)-gx\.([0-9]+)$ ]]; then
            echo "release.yml: tag '${tag_name}' does not match the gx-v<X.Y.Z>-gx.<n> convention" >&2
            exit 1
          fi
          tag_upstream="${BASH_REMATCH[1]}"
          tag_gx_release="${BASH_REMATCH[2]}"
          # '-gx.' -> '+gx.': the only translation between the tag spelling
          # and the version.sh spelling.
          mapped_version="${tag_upstream}+gx.${tag_gx_release}"

          if [[ "${mapped_version}" != "${expected_version}" ]]; then
            echo "release.yml: tag '${tag_name}' maps to '${mapped_version}', but scripts/gx/version.sh reports '${expected_version}'" >&2
            exit 1
          fi

          gx_bin="${{ steps.build.outputs.gx_bin_path }}"
          version_output="$("${gx_bin}" --version)"
          echo "gx --version: ${version_output}"

          if [[ "${version_output}" != *"${expected_version}"* ]]; then
            echo "release.yml: 'gx --version' output does not contain expected version '${expected_version}': ${version_output}" >&2
            exit 1
          fi

          echo "version=${expected_version}" >> "$GITHUB_OUTPUT"

      - name: Package archive
        id: package
        run: |
          set -euo pipefail
          gx_bin="${{ steps.build.outputs.gx_bin_path }}"
          stage_dir="$(mktemp -d)/gx"
          mkdir -p "${stage_dir}"
          cp -- "${gx_bin}" "${stage_dir}/gx"
          cp -- LICENSE "${stage_dir}/LICENSE"
          cp -- THIRD-PARTY-NOTICES "${stage_dir}/THIRD-PARTY-NOTICES"
          chmod +x "${stage_dir}/gx"

          archive_name="gx-${{ steps.version.outputs.version }}-${{ matrix.archive_os }}.tar.gz"
          tar -czf "${archive_name}" -C "$(dirname -- "${stage_dir}")" gx
          sha256sum "${archive_name}" > "${archive_name}.sha256"

          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gx-${{ matrix.archive_os }}
          path: |
            ${{ steps.package.outputs.archive_name }}
            ${{ steps.package.outputs.archive_name }}.sha256
          if-no-files-found: error
          retention-days: 14

  verify-artifacts:
    name: verify-artifacts (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            archive_os: macos-arm64
          - name: linux-x86_64
            os: ubuntu-22.04
            archive_os: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gx-${{ matrix.archive_os }}

      - name: Extract and smoke-test
        run: |
          set -euo pipefail
          archive="$(ls -- gx-*.tar.gz)"
          sha256sum -c "${archive}.sha256"
          tar -xzf "${archive}"
          chmod +x gx/gx

          version_output="$(./gx/gx --version)"
          echo "gx --version: ${version_output}"
          expected_version="${{ needs.build.outputs.version }}"
          if [[ "${version_output}" != *"${expected_version}"* ]]; then
            echo "verify-artifacts: 'gx --version' does not contain expected version '${expected_version}': ${version_output}" >&2
            exit 1
          fi

          ./gx/gx models --help

  release:
    name: create GitHub release
    needs: verify-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -la dist

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/gx-*.tar.gz
            dist/gx-*.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
